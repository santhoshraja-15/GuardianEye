services:
  # ============================================================================
  # 1. PostgreSQL with pgvector extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guardian_eye_postgres
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian_password
      POSTGRES_DB: guardian_eye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian_eye"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - guardian_net

  # ============================================================================
  # 2. Redis Message Broker & Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: guardian_eye_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - guardian_net

  # ============================================================================
  # 3. MinIO S3-Compatible Object Storage
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: guardian_eye_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - guardian_net

  # ============================================================================
  # 4. GuardianEye Backend API Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: guardian_eye_backend
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://guardian:guardian_password@postgres:5432/guardian_eye
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - ./models:/app/models
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guardian_net

  # ============================================================================
  # 5. Celery Asynchronous Video Processing Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: guardian_eye_worker
    command: celery -A backend.workers.celery_app worker --loglevel=info -c 2
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://guardian:guardian_password@postgres:5432/guardian_eye
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - ./models:/app/models
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guardian_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  guardian_net:
    driver: bridge

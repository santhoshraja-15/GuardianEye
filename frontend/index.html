<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuardianEye — AI Risk &amp; Intelligence</title>
    <!-- Inline script: read persisted theme from localStorage BEFORE React
         paints to avoid a flash of wrong theme on refresh. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('guardianeye-app') || '{}');
          var theme = stored && stored.state && stored.state.theme === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
